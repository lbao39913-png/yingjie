name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.3"
          cache: true
          pub-cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dart/Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Cap Gradle memory for CI
        run: |
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=1G/' android/gradle.properties

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK output
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: yingjie-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
