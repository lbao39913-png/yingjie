name: yingjie
description: Yingjie - a legal media aggregator and player for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  video_player: ^2.10.0
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  file_picker: ^8.3.7

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
